name: Validar web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install --requirement requirements.txt
      - run: npm run catalog:migrate:check
      - run: npm run catalog:generate
      - run: npm run catalog:validate
      - name: Comprobar artefactos generados
        run: git diff --exit-code -- data/generated/catalog.json data/generated/search-index.json data/generated/generation-report.json
      - run: npm test
      - run: npm run lint
      - name: Subir web compilada
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: out
      - name: Crear ZIP para preview local
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: zip -qr web-out.zip out
      - name: Publicar release local-preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete local-preview --yes --cleanup-tag || true
          gh release create local-preview web-out.zip \
            --target "$GITHUB_SHA" \
            --title "Local preview" \
            --notes "Build estático de la web para pruebas locales. El archivo web-out.zip contiene la carpeta out/ generada desde main."
